server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The built JavaScript and CSS. A missing file is a real 404, not the app's
    # HTML page sent back in place of a script.
    location /assets/ {
        try_files $uri =404;
    }

    # Every other address, such as /tickets/12, is a page of the React app,
    # not a file on disk. Send index.html and let React Router show the right
    # page, so refreshing or opening a bookmarked link works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
